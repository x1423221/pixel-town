<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<link rel="icon" type="image/svg+xml" href="./favicon.svg" />
<title>像素小遊戲</title>
<style id="lock-style">
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: #1b2140; color: #f3efe8; font-family: "Noto Sans TC", system-ui, sans-serif;
    display: grid; place-items: center; padding: 24px; -webkit-tap-highlight-color: transparent;
  }
  .lock { width: min(320px, 100%); text-align: center; display: grid; gap: 16px; justify-items: center; }
  canvas { width: 96px; height: 120px; image-rendering: pixelated; }
  .lock.shake canvas, .lock.shake .box { animation: shake 0.4s; }
  .title { font-size: 18px; letter-spacing: 4px; }
  .box { width: 100%; background: #f3efe8; color: #1b2140; border: 4px solid #1b2140; outline: 3px solid #f3efe8; padding: 14px; display: grid; gap: 10px; }
  .hint { font-size: 14px; }
  input {
    font: inherit; font-size: 20px; text-align: center; letter-spacing: 3px; width: 100%;
    padding: 8px; border: 3px solid #1b2140; background: #fff; color: #1b2140; outline: none;
  }
  button {
    font: inherit; font-size: 17px; font-weight: 700; padding: 10px; cursor: pointer;
    background: #c23b4a; color: #fff; border: 3px solid #1b2140; box-shadow: 0 3px 0 #8e1a2a;
  }
  button:active { transform: translateY(2px); box-shadow: 0 1px 0 #8e1a2a; }
  button:disabled { opacity: 0.6; }
  .msg { font-size: 14px; min-height: 1.4em; color: #ffd166; }
  @keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
</style>
</head>
<body>
  <div class="lock" id="lock">
    <canvas id="icon" width="24" height="30"></canvas>
    <p class="title">請輸入密碼</p>
    <form class="box" id="form">
      <p class="hint">輸入正確的密碼，才能打開喔</p>
      <input id="pw" type="text" autocomplete="off" autocapitalize="characters" spellcheck="false" />
      <button id="go" type="submit">打開</button>
    </form>
    <p class="msg" id="msg"></p>
  </div>
<script>
// 像素鎖頭
const c = document.getElementById('icon').getContext('2d')
const p = (x, y, w, h, col) => { c.fillStyle = col; c.fillRect(x, y, w, h) }
p(6, 2, 12, 3, '#c9ccd6'); p(4, 4, 3, 10, '#c9ccd6'); p(17, 4, 3, 10, '#c9ccd6')
p(2, 12, 20, 16, '#ffd166'); p(2, 12, 20, 2, '#fff2c8'); p(2, 26, 20, 2, '#c9a44a')
p(10, 17, 4, 4, '#1b2140'); p(11, 20, 2, 4, '#1b2140')

const SAVE = 'pixel-game-pass'
const $ = (id) => document.getElementById(id)
const from64 = (s) => Uint8Array.from(atob(s), (ch) => ch.charCodeAt(0))
let enc = null

async function unlock(password) {
  enc = enc || await (await fetch('./game.enc', { cache: 'no-store' })).json()
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey'])
  const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: from64(enc.salt), iterations: enc.iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt'])
  const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: from64(enc.iv) }, key, from64(enc.data)) // 密碼錯會在這裡失敗
  return JSON.parse(new TextDecoder().decode(plain))
}

async function start(game) {
  document.getElementById('lock').remove()
  document.getElementById('lock-style').remove() // 密碼畫面的樣式拿掉，才不會影響遊戲（例如把遊戲畫面壓扁）
  const style = document.createElement('style'); style.textContent = game.css; document.head.appendChild(style)
  if (game.title) document.title = game.title
  const app = document.createElement('div'); app.id = 'app'; document.body.appendChild(app)
  const url = URL.createObjectURL(new Blob([game.js], { type: 'text/javascript' }))
  await import(url)
}

async function tryPassword(pw, quiet) {
  $('go').disabled = true
  if (!quiet) $('msg').textContent = '開鎖中……'
  try {
    const game = await unlock(pw)
    try { localStorage.setItem(SAVE, pw) } catch (e) {} // 這支手機記住密碼，下次不用再輸入
    await start(game)
  } catch (e) {
    $('go').disabled = false
    if (quiet) { $('msg').textContent = ''; return }
    $('msg').textContent = '密碼不對喔，再想想看～'
    const lock = $('lock'); lock.classList.remove('shake'); void lock.offsetWidth; lock.classList.add('shake')
  }
}

$('form').addEventListener('submit', (e) => { e.preventDefault(); const pw = $('pw').value.trim().toUpperCase(); if (pw) tryPassword(pw) })
let saved = null
try { saved = localStorage.getItem(SAVE) } catch (e) {}
if (saved) tryPassword(saved, true)
</script>
</body>
</html>
